name: rust-metal

on:
  push:
    branches:
      - main
      - metal-spatial-join
      - draft/metal-spatial-join
      - feat/metal-spatial-join
    paths:
      - 'c/sedona-metalspatial/**'
      - 'rust/sedona-spatial-join/**'
      - 'rust/sedona-spatial-join-gpu/**'
      - '.github/workflows/rust-metal.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
      - metal-spatial-join
      - draft/metal-spatial-join
      - feat/metal-spatial-join
    paths:
      - 'c/sedona-metalspatial/**'
      - 'rust/sedona-spatial-join/**'
      - 'rust/sedona-spatial-join-gpu/**'
      - '.github/workflows/rust-metal.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-rust-metal
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-metal:
    name: "Metal Spatial Join (Apple Silicon macos-15)"
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (GEOS)
        run: |
          brew install geos

      - name: Run sedona-metalspatial Tests (Gates 1-7, Flattener, Refiner, and Index)
        run: |
          cargo test -p sedona-metalspatial -- --nocapture 2>&1 | tee sedona-metalspatial.log

      - name: Run C++ Scalable Spatial Index Tests (Hardware RT & Spatial Hash 50k x 50k)
        working-directory: c/sedona-metalspatial
        run: |
          make test_index_scale 2>&1 | tee ../../test_index_scale.log

      - name: Run Phase 4 End-to-End Integration Tests (sedona-spatial-join-gpu)
        run: |
          cargo test -p sedona-spatial-join-gpu --features metal -- --nocapture 2>&1 | tee sedona-spatial-join-gpu.log

      - name: Generate Metal Execution and Test Coverage Summary
        if: always()
        run: |
          echo "## Metal Spatial Join Test & Hardware Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f sedona-metalspatial.log ]; then
            echo "--- sedona-metalspatial ---" >> $GITHUB_STEP_SUMMARY
            grep "test result:" sedona-metalspatial.log >> $GITHUB_STEP_SUMMARY || echo "No test results recorded" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f test_index_scale.log ]; then
            echo "--- test_index_scale ---" >> $GITHUB_STEP_SUMMARY
            grep -E "\[SKIPPED\]|Passed|FAILED|All tests passed" test_index_scale.log >> $GITHUB_STEP_SUMMARY || echo "No index scale results recorded" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f sedona-spatial-join-gpu.log ]; then
            echo "--- sedona-spatial-join-gpu ---" >> $GITHUB_STEP_SUMMARY
            grep "test result:" sedona-spatial-join-gpu.log >> $GITHUB_STEP_SUMMARY || echo "No test results recorded" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Known Coverage Gaps" >> $GITHUB_STEP_SUMMARY
          echo "- **Hardware Ray Tracing (RT Cores)**: GitHub Actions virtualized macOS runners run on an \`Apple Paravirtual device\` where Metal 3 ray tracing acceleration structures are not exposed by the hypervisor (\`device.supportsRaytracing == NO\`). Hardware RT tests are skipped on CI runners and must be verified on bare metal Apple Silicon hardware." >> $GITHUB_STEP_SUMMARY
          if grep -q "\[SKIPPED\]" test_index_scale.log 2>/dev/null; then
            echo "  - Skipped tests detected in index scale suite:" >> $GITHUB_STEP_SUMMARY
            grep "\[SKIPPED\]" test_index_scale.log | sed 's/^/    - /' >> $GITHUB_STEP_SUMMARY
          fi
