name: rust-metal

on:
  push:
    branches:
      - main
      - metal-spatial-join
    paths:
      - 'c/sedona-metalspatial/**'
      - 'rust/sedona-spatial-join/**'
      - 'rust/sedona-spatial-join-gpu/**'
      - '.github/workflows/rust-metal.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
      - metal-spatial-join
    paths:
      - 'c/sedona-metalspatial/**'
      - 'rust/sedona-spatial-join/**'
      - 'rust/sedona-spatial-join-gpu/**'
      - '.github/workflows/rust-metal.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-rust-metal
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-metal:
    name: "Metal Spatial Join (Apple Silicon macos-15)"
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (GEOS)
        run: |
          brew install geos

      - name: Run sedona-metalspatial Tests (Gates 1-7, Flattener, Refiner, and Index)
        run: |
          cargo test -p sedona-metalspatial -- --nocapture

      - name: Run C++ Scalable Spatial Index Tests (Hardware RT & Spatial Hash 50k x 50k)
        working-directory: c/sedona-metalspatial
        run: |
          make test_index_scale

      - name: Run Phase 4 End-to-End Integration Tests (sedona-spatial-join-gpu)
        run: |
          cargo test -p sedona-spatial-join-gpu --features metal -- --nocapture
