[package]
name = "sedona-metalspatial"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Apple Silicon Metal Spatial Join Engine for SedonaDB"
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[build-dependencies]
cc = { version = "1.0" }

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
byteorder = { workspace = true }
geo-traits = { workspace = true }
thiserror = { workspace = true }
wkb = { workspace = true }

[dev-dependencies]
robust = "1.2.0"
wkt = { workspace = true }
sedona-metalspatial = { path = ".", features = ["test-internals"] }

[features]
default = []
test-internals = []
